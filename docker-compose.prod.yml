version: "3.7"

services:
    web:
        build:
            context: ./
            dockerfile: Dockerfile
            args:
                REQUIREMENTS: prod
        command: ./docker-entrypoint.sh -- gunicorn django_template.wsgi:application --bind 0.0.0.0:8000 --workers 3
        ports:
            - 8000:8000
        env_file:
            - .env
        environment:
            - DJANGO_SETTINGS_MODULE=django_template.settings.prod
            - BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
            - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/1
            - CELERY_CACHE_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/2
        depends_on:
            - db
        healthcheck:
            # gunicorn only listens after docker-entrypoint.sh has migrated
            test: ["CMD", "nc", "-z", "127.0.0.1", "8000"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 300s
    db:
        image: postgres:14-alpine
        volumes:
          - django_template_db:/var/lib/postgresql/data
        environment:
            - POSTGRES_USER=${DB_USER}
            - POSTGRES_PASSWORD=${DB_PASSWORD}
            - POSTGRES_DB=${DB_NAME}
    redis:
        image: redis:8.10.3-alpine
        command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
        volumes:
            - ./tmp/redis/data:/data
    worker:
        build:
            context: ./
            args:
                REQUIREMENTS: prod
        entrypoint: celery
        command: -A django_template worker --beat --scheduler django -l info -E
        env_file:
            - .env
        environment:
            - DJANGO_SETTINGS_MODULE=django_template.settings.prod
            - BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
            - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/1
            - CELERY_CACHE_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/2
        depends_on:
            redis:
                condition: service_started
            web:
                condition: service_healthy
    flower:
        build:
            context: ./
            args:
                REQUIREMENTS: prod
        command: celery -A django_template flower
        ports:
            - 127.0.0.1:5555:5555
        env_file:
            - .env
        environment:
            - DJANGO_SETTINGS_MODULE=django_template.settings.prod
            - BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
            - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/1
            - CELERY_CACHE_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/2
        depends_on:
            - worker
            - redis

volumes:
    django_template_db:
