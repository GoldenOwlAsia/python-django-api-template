version: "3.7"

services:
    web:
        build:
            context: ./
            dockerfile: Dockerfile
        command: ./docker-entrypoint.sh -- python manage.py runserver 0.0.0.0:8000
        volumes:
            - .:/usr/src/app/
        ports:
            - 8000:8000
        environment:
            - SECRET_KEY=${SECRET_KEY}
            - DJANGO_SETTINGS_MODULE=django_template.settings.dev
        depends_on:
            - db
        healthcheck:
            # runserver only listens after docker-entrypoint.sh has migrated
            test: ["CMD", "nc", "-z", "127.0.0.1", "8000"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 300s
    db:
        image: postgres:14-alpine
        volumes:
          - django_template_db:/var/lib/postgresql/data
        environment:
            - POSTGRES_USER=${DB_DEV_USER}
            - POSTGRES_PASSWORD=${DB_DEV_PASSWORD}
            - POSTGRES_DB=${DB_DEV_NAME}
        ports:
            - 127.0.0.1:5432:5432
    redis:
        image: redis:8.10.3-alpine
        volumes:
            - ./tmp/redis/data:/data
        ports:
            - 127.0.0.1:6379:6379
    worker:
        build: ./
        entrypoint: celery
        command: -A django_template worker --beat --scheduler django -l info -E
        volumes:
            - .:/app
        env_file:
            - .env
        environment:
            - BROKER_URL=${BROKER_URL}
            - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
            - CELERY_CACHE_BACKEND=${CELERY_CACHE_BACKEND}
        depends_on:
            redis:
                condition: service_started
            web:
                condition: service_healthy
    flower:
        build: ./
        command: celery -A django_template flower
        volumes:
            - .:/data
        working_dir: /data
        ports:
            - 5555:5555
        environment:
            - BROKER_URL=${BROKER_URL}
            - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
        depends_on:
            - worker
            - redis

volumes:
    django_template_db:
