[flake8]
exclude =
  */migrations/*
  */settings/*
  .claude/*
  .venv
  env
  venv
ignore = F405,W504,W503
# Package __init__ files re-export their modules
per-file-ignores =
  */__init__.py:F401,F403
max-line-length = 88

[isort]
line_length = 88
profile = black
known_first_party = authentication
include_trailing_comma = true
multi_line_output = 3
extend_skip = env
